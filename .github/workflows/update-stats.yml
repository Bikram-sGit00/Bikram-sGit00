# .github/workflows/update-stats.yml
name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC — change the cron if you want a different time
  workflow_dispatch:        # adds the manual "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required — lets this job push the generated SVGs back to the repo

    steps:
      - uses: actions/checkout@v6   # pulls your repo into the runner so the commit step below has something to push to

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=github_dark
          # github.repository_owner auto-fills to your username — no hardcoding needed
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=github_dark
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Generate trophy 
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg 
        with: 
          username: Bikram-sGit00 
          output_path: profile/trophy.svg 
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update stats cards" || echo "nothing to commit"
          # the || echo above stops the job from failing on days where stats haven't changed
          git push
